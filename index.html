<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>CPX da Sombra</title><style>
:root{--bg:#0b0b0d;--p:#17171b;--l:#2c2c33;--t:#f3eeee;--m:#a1989b;--r:#d4202c;--d:#7a0f18;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:light){:root:not([data-theme=dark]){--bg:#f7f2f2;--p:#fff;--l:#e2d5d6;--t:#1b1315;--m:#6c5f63}}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--t);font:15px system-ui,-apple-system,"Segoe UI",sans-serif}
h1{margin:0 0 4px;color:var(--r);letter-spacing:.5px}h3{margin:14px 0 6px}
button{background:var(--r);color:#fff;border:0;border-radius:8px;padding:10px 14px;font:inherit;cursor:pointer;margin:3px}
button.g{background:var(--p);color:var(--t);border:1px solid var(--l)}
input,select{width:100%;padding:10px;margin:4px 0 8px;background:var(--p);color:var(--t);border:1px solid var(--l);border-radius:8px;font:inherit}
.c{max-width:520px;margin:0 auto;padding:20px 14px}.card{background:var(--p);border:1px solid var(--l);border-radius:12px;padding:12px;margin:8px 0}
.e{color:var(--r);min-height:18px;font-size:13px}.m{color:var(--m)}
.sh{display:flex;height:100vh;height:100dvh}
.nav{width:300px;flex:none;display:flex;flex-direction:column;overflow-y:auto;background:var(--p);border-right:2px solid var(--d)}
.sbh{display:flex;align-items:center;gap:10px;padding:12px;background:var(--d);color:#fff;position:sticky;top:0;z-index:2}.sbh .tx{flex:1}.sbh button{margin:0;padding:6px 10px}.sbh .tx span{color:#fcdcdc}
.tr{display:flex;align-items:center;gap:12px;padding:12px;cursor:pointer;border-bottom:1px solid var(--l)}.tr:hover{background:var(--bg)}.tr.on{background:var(--bg);border-left:4px solid var(--r)}
.av{width:44px;height:44px;flex:none;border-radius:50%;background:var(--r);color:#fff;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:700}
.tx{display:flex;flex-direction:column;min-width:0}.tx span{font-size:12px;color:var(--m);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bk{display:none;margin-bottom:8px}
.gh{padding:8px 12px;font-size:11px;letter-spacing:1px;color:var(--r);background:var(--bg);font-weight:700}
@media(max-width:700px){.nav{width:100%}.sh.lst .w{display:none}.sh:not(.lst) .nav{display:none}.bk{display:inline-block}}
.w{flex:1;min-width:0;overflow-y:auto;padding:12px 12px 120px}
.ch{max-height:48vh;overflow:auto;background:var(--p);border:1px solid var(--l);border-radius:10px;padding:8px}.ch p{margin:6px 0}.ch .bot b{color:var(--r)}.ch i{color:var(--m);font-size:11px;margin-left:6px}
.in{display:flex;gap:6px;margin-top:8px}.in input{margin:0}
.gr{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}.it{background:var(--p);border:1px solid var(--l);border-radius:12px;padding:12px;cursor:pointer;text-align:center}.ph{height:64px;border-radius:8px;background:linear-gradient(135deg,var(--d),#000);margin-bottom:8px}
table{width:100%;border-collapse:collapse;font-size:12px}td,th{border:1px solid var(--l);padding:5px;text-align:left}.sc{overflow-x:auto}
#md:not(:empty){position:fixed;inset:0;background:#000a;display:flex;align-items:center;justify-content:center;padding:14px;z-index:9}.mb{background:var(--p);border:1px solid var(--r);border-radius:12px;padding:16px;width:100%;max-width:400px;max-height:90vh;overflow:auto}
#bb{position:fixed;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));background:var(--d);color:#fff;border-radius:16px;padding:10px 14px;font-size:13px;z-index:5;box-shadow:0 4px 14px #0008}
a{color:var(--r);cursor:pointer}label{font-size:13px;color:var(--m)}
</style></head><body><div id=app></div><div id=md></div><div id=bb hidden></div><script>
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let S={users:[],owner:null,msgs:{},lm:[],logs:[],ll:[],orders:[],stock:{},codes:[],cupons:[]};
try{S=Object.assign(S,JSON.parse(localStorage.getItem('cpx')||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem('cpx',JSON.stringify(S))}catch(e){}};
const C={dono:'Dono',sub:'Sub dono',gg:'Gerente Geral',gm:'Gerente de Metas',mem:'Membro',ali:'Aliado',cli:'Visitante'},ST=['dono','sub','gg','gm'],TP=['dono','sub'],GG=['dono','sub','gg'];
const IT=[['Colt 45',50],['Desert Eagle',120],['Combat Shotgun',150],['Uzi',100],['M4',200],['Sniper Rifle',300],['Maconha',10],['C4',250],['Lockpick',20]];
if(!S.items)S.items=IT.map(i=>({n:i[0],p:i[1],f:''}));
const syncIT=()=>{IT.length=0;S.items.forEach(i=>{IT.push([i.n,i.p,i.f]);if(S.stock[i.n]==null)S.stock[i.n]=10});save()};syncIT();
const PW=/^(?=.*[A-Za-z])(?=.*\d)(?=.*[^A-Za-z0-9]).{5,}$/;
const H=async s=>[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s)))].map(b=>b.toString(16).padStart(2,'0')).join('');
let V={scr:'home',u:null,g:null,tab:'meta',sub:null,m:'reg'};
const U=()=>S.users.find(x=>x.rg==V.u)||V.g,hi=()=>{let h=new Date().getHours();return h<12?'Bom dia':h<18?'Boa tarde':'Boa noite'};
const hm=()=>new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
const log=(x,s)=>{(s?S.ll:S.logs).unshift(new Date().toLocaleString('pt-BR')+' — '+x);save()};
const say=(k,n,c,x)=>{(S.msgs[k]=S.msgs[k]||[]).push({n,c,x,t:hm()});save()};
const go=(s,m)=>{V.scr=s;if(m)V.m=m;render()},err=m=>{$('#er').textContent=m};
const tot=i=>S.lm.filter(l=>l.st=='ok'&&l.i==i).reduce((a,l)=>a+(l.a=='Guardar'?l.q:-l.q),0);
const snap=()=>{S.snap={a:tot('Maconha'),b:tot('Materiais'),t:hm()};save()};
const ic=s=>s=='aberta'?'⏳':s=='concluida'?'✅':'❌';
function render(){let u=V.scr=='app'?U():0,nv=document.querySelector('.nav'),ns=nv?nv.scrollTop:0,wv=document.querySelector('.w'),ws=wv?wv.scrollTop:0,same=V.lt==V.tab&&V.ls==V.sub;$('#app').innerHTML=({home,auth,own,buy,onb,app})[V.scr]();nv=document.querySelector('.nav');if(nv)nv.scrollTop=ns;wv=document.querySelector('.w');if(wv&&same)wv.scrollTop=ws;V.lt=V.tab;V.ls=V.sub;let b=$('#bb');if(u&&ST.includes(u.cargo)){b.hidden=false;b.innerHTML=`Maconha: <b>${S.snap.a}</b><br>Materiais: <b>${S.snap.b}</b><br><small>atualiza a cada hora · ${S.snap.t}</small>`}else b.hidden=true;let c=document.querySelector('.ch');if(c)c.scrollTop=c.scrollHeight}
function ask(t,fs,cb){$('#md').innerHTML=`<div class=mb><h3>${t}</h3>${fs.map(f=>`<label>${f.l}${f.o?`<select id=f_${f.id}>${f.o.map(o=>`<option>${o}</option>`).join('')}</select>`:f.f?`<input type=file id=f_${f.id}>`:`<input id=f_${f.id} type=${f.n?'number':f.p?'password':'text'} value="${f.d!=null?esc(f.d):''}">`}</label>`).join('')}<div class=e id=er2></div><button id=ok>Confirmar</button><button class=g onclick="$('#md').innerHTML=''">Cancelar</button></div>`;
$('#ok').onclick=async()=>{let v={};fs.forEach(f=>{let e=$('#f_'+f.id);v[f.id]=f.f?(e.files[0]?e.files[0].name:''):e.value.trim();if(f.f)v[f.id+'F']=e.files[0]});let r=await cb(v);if(r)$('#er2').textContent=r;else{$('#md').innerHTML='';render()}}}
const home=()=>`<div class=c><h1>CPX da Sombra</h1><p class=m>O que você busca?</p><div class=card><button onclick="go('auth','reg')">Ser membro</button><button class=g onclick="go('buy')">Comprar</button></div><a onclick="go('own')">Acesso do Dono</a><p class=m style="font-size:12px;margin-top:24px">Versão de demonstração: os dados ficam só neste navegador.</p></div>`;
const auth=()=>`<div class=c><h1>Membro</h1><div><button class="${V.m=='reg'?'':'g'}" onclick="go('auth','reg')">Cadastrar</button><button class="${V.m=='log'?'':'g'}" onclick="go('auth','log')">Entrar</button></div>${V.m=='reg'?`<label>RG</label><input id=rg><label>Nome (OCC)</label><input id=nm><label>Telefone para contato</label><input id=tl><label>Código</label><input id=cd><label>Código de acesso (dado pelo Dono)</label><input id=ac><label>Print do RG</label><input id=pr type=file accept="image/*"><label>Senha (5+ caracteres, letra, número e símbolo)</label><input id=pw type=password><div class=e id=er></div><button onclick="doReg()">Concluir cadastro</button>`:`<label>RG</label><input id=rg><label>Senha</label><input id=pw type=password><label>Código de acesso</label><input id=ac><div class=e id=er></div><button onclick="doLog()">Entrar</button>`}<br><a onclick="go('home')">← Voltar</a></div>`;
async function doReg(){let g=i=>$('#'+i).value.trim(),f=$('#pr').files[0],rg=g('rg'),nome=g('nm'),tel=g('tl'),cod=g('cd'),pw=g('pw'),ac=g('ac');
if(!rg||!nome||!tel||!cod)return err('Preencha RG, nome, telefone e código.');if(!/^[\w-]{1,20}$/.test(rg))return err('RG: só letras, números e hífen.');if(!f)return err('Envie o print do RG.');
if(!PW.test(pw))return err('A senha precisa de 5+ caracteres, com letra, número e símbolo.');if(S.users.some(u=>u.rg==rg))return err('Este RG já está cadastrado.');let ce=S.codes.find(c=>c.rg==rg);if(!ce||ce.ch!=await H(ac))return err('Código de acesso incorreto para este RG. Peça o código ao Dono.');ce.used=1;
S.users.push({rg,nome,tel,cod,pr:f.name,ph:await H(pw),cargo:'mem',adv:0,ob:0});log(`Novo cadastro: ${nome} (${rg})`);V.u=rg;
say('sombra:'+rg,'Sombra','bot',`${hi()}, ${nome}! Eu sou a Sombra, assistente da CPX da Sombra, e vou te guiar nos primeiros passos. Seu cargo agora é Membro. As regras da org serão enviadas pela equipe. Você tem alguma dúvida ou algo em que eu ainda possa ajudar?`);go('onb')}
async function doLog(){let rg=$('#rg').value.trim(),u=S.users.find(x=>x.rg==rg);if(!u||u.ph!=await H($('#pw').value))return err('RG ou senha incorretos.');let ce=S.codes.find(c=>c.rg==rg);if(!ce||ce.ch!=await H($('#ac').value.trim()))return err('Código de acesso incorreto.');V.u=rg;if(u.ob==1)enter();else go('onb')}
function enter(){let u=U();u.ob=1;V.tab=u.cargo=='ali'?'qrr':'meta';V.sub=null;V.mv=1;save();go('app')}
const own=()=>S.owner?`<div class=c><h1>Dono</h1><label>ID</label><input id=rg><label>Senha</label><input id=pw type=password><div class=e id=er></div><button onclick="ownLog()">Entrar</button><br><a onclick="go('home')">← Voltar</a></div>`:`<div class=c><h1>Primeiro acesso do Dono</h1><p class=m>Na versão real o servidor reconhece o seu ID. Aqui você define o seu.</p><label>ID</label><input id=rg><label>Código de segurança</label><input id=cs type=password><label>Nome</label><input id=nm><label>Telefone</label><input id=tl><label>E-mail</label><input id=em><label>Senha</label><input id=pw type=password><div class=e id=er></div><button onclick="own1()">Criar acesso</button><br><a onclick="go('home')">← Voltar</a></div>`;
async function own1(){let g=i=>$('#'+i).value.trim(),rg=g('rg');if(!/^\d{3,12}$/.test(rg)||!g('cs')||!g('nm')||!g('tl')||!g('em'))return err('Preencha tudo (ID só com números).');if(!PW.test(g('pw')))return err('Senha fraca: 5+ caracteres com letra, número e símbolo.');
S.owner=rg;S.users.push({rg,nome:g('nm'),tel:g('tl'),em:g('em'),cod:'-',pr:'',ph:await H(g('pw')),sc:await H(g('cs')),cargo:'dono',adv:0,ob:1});log('Conta do Dono criada');V.u=rg;enter()}
async function ownLog(){let rg=$('#rg').value.trim(),u=S.users.find(x=>x.rg==rg&&x.rg==S.owner);if(!u||u.ph!=await H($('#pw').value))return err('ID ou senha incorretos.');V.u=rg;enter()}
const buy=()=>`<div class=c><h1>Comprar</h1><label>Seu nome</label><input id=nm><label>Contato</label><input id=tl><label>Org (opcional)</label><input id=og><div class=e id=er></div><button onclick="buy1()">Ver a loja</button><br><a onclick="go('home')">← Voltar</a></div>`;
function buy1(){let n=$('#nm').value.trim();if(!n||!$('#tl').value.trim())return err('Informe nome e contato.');V.g={rg:'v'+Date.now(),nome:n,org:$('#og').value.trim(),cargo:'cli'};V.u=null;V.tab='loja';V.mv=0;go('app')}
const onb=()=>{let u=U();return `<div class=c><h1>Sombra</h1>${chBox('sombra:'+u.rg)}${u.ob==2?`<button onclick="enter()">Entrar no menu</button>`:`<button onclick="dv()">Tenho uma dúvida</button><button onclick="nd()">Não tenho dúvidas</button>`}</div>`};
function dv(){let u=U(),k='sombra:'+u.rg;say(k,u.nome,'','Tenho uma dúvida.');say(k,'Sombra','bot','Depois que você entrar, tire as dúvidas com a equipe pelo Atendimento. Posso ajudar com mais alguma coisa?');render()}
function nd(){let u=U(),k='sombra:'+u.rg;say(k,u.nome,'','Não tenho dúvidas.');say(k,'Sombra','bot','Antes de sair: use /lm para gerenciar a sua meta diária e enviar tudo o que guardou ou utilizou (com print ou motivo). Advertências: 3 advertências levam à remoção da org, e cada uma pode ser paga com 100 mil.');say(k,'Sombra','bot','A Sombra saiu do chat. O Dono assume as suas metas daqui.');u.ob=2;save();render()}
function app(){let u=U(),r=u.cargo,t=[];
if(r=='cli')t=[['loja','Loja','l']];else{if(r!='ali')t.push(['meta','Minha meta','o'],['geral','Chat Geral','o']);t.push(['qrr','QRR','o'],['atend','Atendimento','o']);if(ST.includes(r))t.push(['metas','Metas (todos)','o'],['avisos','Avisos','o']);if(TP.includes(r))t.push(['membros','Membros','o'],['codigos','Códigos','o'],['logs','Logs da org','o']);t.push(['loja','Loja','l']);if(GG.includes(r))t.push(['vendas','Vendas','l']);if(TP.includes(r))t.push(['cupons','Cupons','l'])}
return `<div class="sh ${V.mv?'lst':''}"><div class=nav><div class=sbh><div class=av>${esc((u.nome||'?')[0].toUpperCase())}</div><div class=tx><b>${esc(u.nome)}</b><span>${C[r]}${u.adv?' · '+u.adv+'/3 adv.':''}</span></div><button class=g onclick="out()">Sair</button></div>${t.map((x,i)=>{let h=(i==0||t[i-1][2]!=x[2])?`<div class=gh>${x[2]=='l'?'🛒 LOJA':'🛡️ ORG'}</div>`:'';let k={meta:'metas:'+u.rg,geral:'geral',qrr:'qrr',avisos:'gerencia'}[x[0]];return h+`<div class="tr ${V.tab==x[0]?'on':''}" onclick="tb('${x[0]}')"><div class=av>${IC[x[0]]}</div><div class=tx><b>${x[1]}</b><span>${k?pv(k):''}</span></div></div>`}).join('')}</div><div class=w><a class=bk onclick="V.mv=1;render()">← Menu</a>${main(u)}</div></div>`}
const IC={meta:'🎯',geral:'💬',qrr:'📡',atend:'🛎️',loja:'🛒',metas:'📋',avisos:'🔔',vendas:'💰',membros:'👥',codigos:'🔑',logs:'📜',cupons:'🏷️'},pv=k=>{let m=(S.msgs[k]||[]).slice(-1)[0];return m?esc((m.n+': '+m.x).slice(0,38)):'Sem mensagens'};
const tb=t=>{V.tab=t;V.sub=null;V.mv=0;render()},out=()=>{V.u=null;V.g=null;go('home')};
function main(u){let t=V.tab,r=u.cargo;
if(t=='meta')return chBox('metas:'+u.rg)+chIn('metas:'+u.rg)+'<h3>Seus registros /lm</h3>'+lmList(u.rg,0);
if(t=='geral')return chBox('geral')+chIn('geral');
if(t=='qrr')return r=='ali'?(V.pq?'<p>Pedido de QRR enviado à gerência.</p>':`<p>Aliados podem pedir QRR à gerência.</p><button onclick="pq()">Pedir QRR</button>`):chBox('qrr')+chIn('qrr');
if(t=='atend')return GG.includes(r)?lst('atend'):chBox('atend:'+u.rg)+chIn('atend:'+u.rg);
if(t=='metas')return lst('metas');
if(t=='avisos')return chBox('gerencia')+chIn('gerencia');
if(t=='loja')return loja2();
if(t=='ord')return ordv(V.sub);
if(t=='vendas')return vendas();
if(t=='membros')return memb();
if(t=='codigos')return cods();
if(t=='cupons')return cps();
if(t=='logs')return `<h3>Log da org</h3>${S.logs.map(x=>`<p class=m>${esc(x)}</p>`).join('')||'<p class=m>Vazio.</p>'}`}
function pq(){let u=U();say('gerencia','Sombra','bot',`${u.nome} (Aliado) pediu QRR.`);log(`${u.nome} pediu QRR`);V.pq=1;render()}
function lst(k){if(V.sub){let m=S.users.find(x=>x.rg==V.sub);if(m)return `<a onclick="V.sub=null;render()">← Lista</a><h3>${esc(m.nome)}</h3>${k=='metas'?lmList(m.rg,1):''}${chBox(k+':'+m.rg)}${chIn(k+':'+m.rg)}`}
return `<div class=gr>${S.users.filter(x=>x.cargo!='ali'||k=='atend').map(x=>`<div class=it onclick="V.sub='${x.rg}';render()"><b>${esc(x.nome)}</b><br><span class=m>${C[x.cargo]}</span>${k=='metas'&&S.lm.some(l=>l.rg==x.rg&&l.st=='pend')?'<br>⏳ pendente':''}</div>`).join('')}</div>`}
const lmList=(rg,mg)=>S.lm.filter(l=>l.rg==rg).slice(-6).map(l=>`<div class=card>${l.a} ${l.q} de ${l.i} — ${esc(l.x)}<br><b>${l.st=='pend'?'⏳ pendente':l.st=='ok'?'✅ confirmado':'❌ negado: '+esc(l.mo)}</b>${mg&&l.st=='pend'?`<br><button onclick="lc(${l.id},1)">Confirmar</button><button class=g onclick="lc(${l.id},0)">Negar</button>`:''}</div>`).join('');
function lc(id,ok){let l=S.lm.find(x=>x.id==id);if(ok){l.st='ok';log(`${U().nome} confirmou /lm de ${l.nome}: ${l.a} ${l.q} ${l.i}`);save();render()}else ask('Negar /lm',[{id:'m',l:'Motivo'}],v=>{if(!v.m)return'Informe o motivo.';l.st='no';l.mo=v.m;say('metas:'+l.rg,U().nome,'','Seu /lm foi negado: '+v.m);log(`${U().nome} negou /lm de ${l.nome}: ${v.m}`)})}
const chBox=k=>`<div class=ch>${(S.msgs[k]||[]).map(m=>`<p class="${m.c}"><b>${esc(m.n)}</b> ${esc(m.x)}<i>${m.t}</i></p>`).join('')||'<p class=m>Sem mensagens.</p>'}</div>`,
chIn=k=>`<div class=in><input id=in placeholder="Escreva ou digite / para comandos" oninput="hint('${k}')" onkeydown="if(event.key=='Enter')send('${k}')"><button onclick="send('${k}')">Enviar</button></div><div id=ht></div>`;
const CM=[['lm','/lm — guardar ou utilizar (meta)',r=>r!='ali'],['adv','/adv — advertir membro',r=>ST.includes(r)],['advt','/advt — remover advertência',r=>ST.includes(r)],['ban','/ban — banir membro',r=>GG.includes(r)],['finalizar','/finalizar — concluir venda (no chat da venda)',r=>GG.includes(r)],['sombra','/sombra abaixa para 10% (ou para um valor)',r=>GG.includes(r)]];
const LJ=['finalizar','sombra'];
function hint(k){let v=$('#in').value,r=U().cargo;$('#ht').innerHTML=v[0]=='/'?CM.filter(c=>c[2](r)&&LJ.includes(c[0])==k.startsWith('ord:')&&c[0].startsWith(v.slice(1).split(' ')[0])).map(c=>`<div class=m>${c[1]}</div>`).join(''):''}
function send(k){let i=$('#in'),t=i.value.trim(),u=U();if(!t)return;i.value='';if(t[0]=='/')return cmd(t,k,u);say(k,u.nome,'',t);if(k.startsWith('ord:'))sb(k,t,u);render()}
function cmd(t,k,u){let [c,...a]=t.slice(1).split(' '),r=u.cargo,f=CM.find(x=>x[0]==c);if(f&&f[2](r)&&LJ.includes(c)!=k.startsWith('ord:')){say(k,'Sombra','bot',LJ.includes(c)?'Esse comando é da loja e só funciona no chat de uma venda.':'Esse comando é da org e não funciona na loja.');return render()}if(!f||!f[2](r)){say(k,'Sombra','bot','Comando indisponível para o seu cargo.');return render()}
if(c=='lm')return lmF(u);if(c=='adv')return advF(1);if(c=='advt')return advF(-1);if(c=='ban')return banF();
if(!k.startsWith('ord:')){say(k,'Sombra','bot','Use esse comando dentro do chat de uma venda.');return render()}
if(c=='finalizar')return fin(k);neg(k,a.join(' '),u)}
function sb(k,t,u){let o=S.orders.find(x=>x.id==+k.slice(4)),s=t.toLowerCase(),R=m=>say(k,'Sombra','bot',m);if(!o||(u.rg!=o.rg&&!/sombra/.test(s)))return;
if(o.st!='aberta')return R('Essa compra já foi encerrada.');
let n=+((s.match(/\d+/)||[0])[0]),d=o.cup+o.lv+o.ex,vf=()=>+(o.q*o.p*(1-d/100)).toFixed(1),st=S.stock[o.it];
if(/cancel/.test(s)){if(/confirm/.test(s)){o.st='cancelada';log('Pedido cancelado (pedido à Sombra): '+o.nome,1);return R('Compra cancelada. Quando quiser, é só abrir outra.')}return R('Tem certeza? Para cancelar, escreva "confirmo cancelar".')}
if(/cupom/.test(s)){let c=(s.match(/cupom\s+(\S+)/)||[])[1];return c?ap(k,o,c):R('Me manda o código assim: "cupom CODIGO".')}
if(/(dono|humano|atendente|gerente)/.test(s)){log('Chamado de donos no pedido de '+o.nome,1);say('gerencia','Sombra','bot',`${o.nome} chamou os donos no pedido de ${o.q}× ${o.it}.`);return R('Chamei o Dono e o Sub dono. Enquanto isso, posso ajudar com quantidade, valor ou estoque.')}
if(n&&/(mais|aument|adicion|acrescent|soma)/.test(s))o.q+=n;
else if(n&&/(menos|tira|diminu|reduz|retira)/.test(s))o.q=Math.max(1,o.q-n);
else if(n&&/(quero|queria|preciso|prefiro|ficar)/.test(s))o.q=n;
else if(/(valor|pre[cç]o|quanto|total)/.test(s))return R(`${o.q}× ${o.it}: valor bruto ${o.q*o.p} mil, desconto total ${d}%, valor final ${vf()} mil.`);
else if(/(estoque|dispon)/.test(s))return R(`Temos ${st} de ${o.it} no estoque.`);
else return R(`${/\b(oi|ol[aá]|bom dia|boa tarde|boa noite)\b/.test(s)?'Oi! ':''}Posso mudar a quantidade ("sombra, mais 2" ou "menos 1"), dizer o valor ou o estoque, aplicar um cupom ("cupom CODIGO"), cancelar ou chamar o Dono.`);
if(o.q>st){o.q=st;save();return R(`Só temos ${st} de ${o.it} no estoque, então deixei a quantidade em ${st}.`)}
save();R(`Pronto! Agora são ${o.q}× ${o.it}. Valor final: ${vf()} mil (desconto total ${d}%). Quer mais alguma coisa?`)}
function lmF(u){ask('/lm — registrar',[{id:'a',l:'O que fazer',o:['Guardar','Utilizar']},{id:'i',l:'Item',o:['Materiais','Maconha']},{id:'q',l:'Quantidade',n:1},{id:'f',l:'Print (obrigatório ao guardar)',f:1},{id:'x',l:'Motivo (obrigatório ao utilizar)'}],v=>{let q=+v.q;if(!(q>0))return'Quantidade inválida.';if(v.a=='Guardar'&&!v.f)return'Envie o print.';if(v.a=='Utilizar'&&!v.x)return'Informe o motivo.';
S.lm.push({id:Date.now(),rg:u.rg,nome:u.nome,a:v.a,i:v.i,q,x:v.a=='Guardar'?'print: '+v.f:v.x,st:'pend'});say('metas:'+u.rg,u.nome,'',`/lm ${v.a} ${q} ${v.i}`);log(`${u.nome} registrou /lm: ${v.a} ${q} ${v.i}`)})}
function advF(d){ask(d>0?'/adv':'/advt',[{id:'r',l:'RG do membro'}].concat(d<0?[{id:'q',l:'Quantas remover',n:1}]:[]).concat([{id:'m',l:'Motivo'}]),v=>{let m=S.users.find(x=>x.rg==v.r);if(!m)return'Membro não encontrado.';if(!v.m)return'Informe o motivo.';let q=d>0?1:Math.max(1,+v.q||1);if(d>0&&m.adv>=3)return'Já tem 3 advertências.';
m.adv=Math.max(0,Math.min(3,m.adv+d*q));log(`${U().nome} ${d>0?'aplicou advertência em':'removeu '+q+' advertência(s) de'} ${m.nome}: ${v.m}`);if(d>0)say('gerencia','Sombra','bot',`${m.nome} recebeu advertência (${m.adv}/3): ${v.m}${m.adv>=3?' — chegou a 3, a gerência decide a remoção.':''}`)})}
function banF(){ask('/ban',[{id:'r',l:'RG do membro'},{id:'m',l:'Motivo'}],v=>{let m=S.users.find(x=>x.rg==v.r);if(!m||m.rg==S.owner)return'Membro inválido.';if(!v.m)return'Informe o motivo.';S.users=S.users.filter(x=>x!=m);log(`${U().nome} baniu ${m.nome}: ${v.m}`)})}
const loja=()=>`<div class=gr>${IT.map(i=>`<div class=it onclick="bq('${i[0]}')"><div class=ph></div><b>${i[0]}</b><br><span class=m>Estoque: ${S.stock[i[0]]}</span><br>${i[1]} mil</div>`).join('')}</div><p class=m style="font-size:12px">Preços de exemplo (editáveis na versão completa).</p>${mine()}`;
const mine=()=>{let o=S.orders.filter(x=>x.rg==U().rg);return o.length?'<h3>Seus pedidos</h3>'+o.map(x=>`<div class=card onclick="V.tab='ord';V.sub=${x.id};render()">${ic(x.st)} ${x.q}× ${x.it}</div>`).join(''):''};
function bq(n){ask('Comprar '+n+' (estoque: '+S.stock[n]+')',[{id:'q',l:'Quantidade',n:1}],v=>{let q=+v.q;if(!(q>0))return'Quantidade inválida.';if(q>S.stock[n])return'Quantidade acima do estoque ('+S.stock[n]+').';let u=U(),id=Date.now(),p=IT.find(i=>i[0]==n)[1];
S.orders.push({id,rg:u.rg,nome:u.nome,org:u.org||'-',it:n,q,p,cup:0,lv:0,ex:0,st:'aberta'});say('ord:'+id,'Sombra','bot',`${hi()}! Aqui é a Sombra, assistente da CPX da Sombra, e vou te guiar até concluir a compra. Muito obrigado por comprar na CPX da Sombra! Você tem um código de desconto? (opcional) Pode falar comigo por aqui: me peça para mudar a quantidade, ver o valor ou chamar o Dono.`);log(`Novo pedido: ${q}× ${n} (${u.nome})`,1);V.tab='ord';V.sub=id})}
function ordv(id){let o=S.orders.find(x=>x.id==id),k='ord:'+id,st=GG.includes(U().cargo);if(!o)return'';let b=o.q*o.p,d=o.cup+o.lv+o.ex,fn=b*(1-d/100);
return `<a onclick="V.tab='${st?'vendas':'loja'}';render()">← Voltar</a><h3>${ic(o.st)} ${esc(o.nome)}</h3><div class=sc><table><tr><th>Produto<th>Qtd<th>Org<th>Valor bruto<th>Cupom<th>Level de afiliado<th>Extra<th>Desc. total<th>Valor final<tr><td>${o.it}<td>${o.q}<td>${esc(o.org)}<td>${b} mil<td>${o.cup}%<td>Level 1 — ${o.lv}%<td>${o.ex}%<td>${d}%<td><b>${+fn.toFixed(1)} mil</b></table></div>${chBox(k)}${o.st=='aberta'?`${chIn(k)}<div><button class=g onclick="oc(${id},'cupom')">Tenho cupom</button><button class=g onclick="oc(${id},'dono')">Chamar donos</button><button class=g onclick="oc(${id},'qm')">Quantidade −</button><button class=g onclick="oc(${id},'qp')">Quantidade +</button><button class=g onclick="oc(${id},'duv')">Tirar dúvidas</button><button class=g onclick="oc(${id},'x')">Cancelar compra</button></div>`:''}`}
function oc(id,a){let o=S.orders.find(x=>x.id==id),k='ord:'+id,u=U();
if(a=='cupom')return ask('Cupom',[{id:'c',l:'Código'}],v=>{say(k,u.nome,'','Cupom: '+v.c);ap(k,o,v.c)});
if(a=='dono'){say(k,u.nome,'','Chamar donos');say(k,'Sombra','bot','Chamei o Dono e o Sub dono para você.');say('gerencia','Sombra','bot',`${o.nome} chamou os donos no pedido de ${o.q}× ${o.it}.`);log('Chamado de donos no pedido de '+o.nome,1)}
if(a=='duv')say(k,'Sombra','bot','Pode mandar a sua dúvida aqui, a equipe responde.');
if(a=='qp'){if(o.q>=S.stock[o.it])say(k,'Sombra','bot','Quantidade acima do estoque.');else o.q++}
if(a=='qm'&&o.q>1)o.q--;
if(a=='x'){o.st='cancelada';log('Pedido cancelado: '+o.nome,1)}
save();render()}
function neg(k,t,u){let o=S.orders.find(x=>x.id==+k.slice(4)),mm=t.match(/(\d+(?:[.,]\d+)?)/);if(!o||o.st!='aberta')return;
if(!mm){say(k,'Sombra','bot','Diga a porcentagem ou o valor final. Ex.: /sombra abaixa para 10%');return render()}
let n=parseFloat(mm[1].replace(',','.')),b=o.q*o.p,ex=t.includes('%')?n:Math.round((1-n/b)*100)-o.cup-o.lv,tt=o.cup+o.lv+ex,r=u.cargo,no=null;
if(ex<0)no='Isso não é um desconto.';else if(r=='gg'&&ex>25)no='O Gerente Geral pode dar no máximo 25% de desconto extra. Peça ao Dono ou Sub dono.';else if(r=='sub'&&tt>80)no='O teto do Sub dono é 80% de desconto total. Só o Dono libera acima disso.';else if(tt>100)no='O desconto total não pode passar de 100%.';
if(no)say(k,'Sombra','bot',no);else{o.ex=ex;say(k,'Sombra','bot',`Feito! Desconto extra de ${ex}% aplicado (total ${tt}%). Valor final: ${+(b*(1-tt/100)).toFixed(1)} mil.`);log(`${u.nome} aplicou extra de ${ex}% no pedido de ${o.nome}`,1)}
save();render()}
function fin(k){let o=S.orders.find(x=>x.id==+k.slice(4));if(!o||o.st!='aberta')return;if(o.q>S.stock[o.it]){say(k,'Sombra','bot','Estoque insuficiente.');return render()}
o.st='concluida';S.stock[o.it]-=o.q;if(o.cc){let cp=S.cupons.find(x=>x.c==o.cc);if(cp)cp.used++}let d=o.cup+o.lv+o.ex;o.fn=o.q*o.p*(1-d/100);say(k,'Sombra','bot',`Venda concluída: ${o.q}× ${o.it}, valor final ${+o.fn.toFixed(1)} mil (desconto total ${d}%). Estoque atualizado.`);log(`${U().nome} finalizou a venda de ${o.nome}: ${o.q}× ${o.it} por ${+o.fn.toFixed(1)} mil`,1);save();render()}
const vendas=()=>`<h3>Vendas</h3>${S.orders.slice().reverse().map(o=>`<div class=card onclick="V.tab='ord';V.sub=${o.id};render()">${ic(o.st)} ${esc(o.nome)} — ${o.q}× ${o.it}</div>`).join('')||'<p class=m>Nenhuma venda ainda.</p>'}<h3>Log da loja</h3>${S.ll.map(x=>`<p class=m>${esc(x)}</p>`).join('')}`;
const memb=()=>`<div class=gr>${S.users.map(x=>`<div class=card><b>${esc(x.nome)}</b><br>RG ${esc(x.rg)} · ${esc(x.tel)} · cód. ${esc(x.cod)}<br>Print: ${esc(x.pr||'-')}<br>Advertências: ${x.adv}/3 · Materiais guardados: ${S.lm.filter(l=>l.rg==x.rg&&l.st=='ok'&&l.i=='Materiais'&&l.a=='Guardar').reduce((a,l)=>a+l.q,0)}<select onchange="cg('${x.rg}',this.value)">${Object.keys(C).filter(c=>c!='cli').map(c=>`<option value=${c} ${c==x.cargo?'selected':''}>${C[c]}</option>`).join('')}</select><button class=g onclick="rs('${x.rg}')">Redefinir senha</button></div>`).join('')}</div>`;
function cg(rg,c){let m=S.users.find(x=>x.rg==rg);if(m.rg!=S.owner){m.cargo=c;log(`${U().nome} mudou o cargo de ${m.nome} para ${C[c]}`)}save();render()}
function rs(rg){ask('Redefinir senha',[{id:'p',l:'Nova senha',p:1}],async v=>{if(!PW.test(v.p))return'Senha fraca.';let m=S.users.find(x=>x.rg==rg);m.ph=await H(v.p);log(`${U().nome} redefiniu a senha de ${m.nome}`)})}
const cods=()=>`<h3>Códigos de acesso</h3><p class=m>Crie um código para um RG específico e passe para a pessoa. Sem o código certo, ninguém se cadastra nem entra como membro.</p>${V.nc?`<div class=card style="border-color:var(--r)">Código para o RG <b>${esc(V.nc[0])}</b>: <b>${esc(V.nc[1])}</b><br><span class=m>Passe agora, ele não aparece de novo.</span><br><button class=g onclick="V.nc=0;render()">Ok</button></div>`:''}<button onclick="nc()">Criar código</button>${S.codes.map(c=>`<div class=card>RG ${esc(c.rg)} · ${c.used?'✅ usado no cadastro':'⏳ aguardando cadastro'}<br><button class=g onclick="rc('${c.rg}')">Revogar</button></div>`).join('')||'<p class=m>Nenhum código criado.</p>'}`;
function nc(){ask('Criar código de acesso',[{id:'r',l:'RG da pessoa'},{id:'c',l:'Código (vazio = gerar automático)'}],async v=>{if(!/^[\w-]{1,20}$/.test(v.r))return'RG inválido.';if(S.codes.some(c=>c.rg==v.r))return'Já existe um código para esse RG. Revogue para criar outro.';let c=v.c||String(crypto.getRandomValues(new Uint32Array(1))[0]%900000+100000);S.codes.push({rg:v.r,ch:await H(c),used:0});V.nc=[v.r,c];log(`${U().nome} criou código de acesso para o RG ${v.r}`);save()})}
function rc(rg){S.codes=S.codes.filter(c=>c.rg!=rg);log(`${U().nome} revogou o código do RG ${rg}`);save();render()}
const NM=/^[A-Za-zÀ-ÿ0-9 .+-]{1,30}$/;
const rz=f=>new Promise(r=>{if(!f)return r('');let fr=new FileReader();fr.onload=()=>{let i=new Image();i.onload=()=>{let c=document.createElement('canvas'),s=Math.min(1,220/Math.max(i.width,i.height));c.width=Math.max(1,i.width*s);c.height=Math.max(1,i.height*s);c.getContext('2d').drawImage(i,0,0,c.width,c.height);r(c.toDataURL('image/jpeg',.7))};i.onerror=()=>r('');i.src=fr.result};fr.onerror=()=>r('');fr.readAsDataURL(f)});
const loja2=()=>{let a=TP.includes(U().cargo);return `${a?`<div style="display:flex;justify-content:space-between;align-items:center"><h3 style="margin:0">Itens da loja</h3><button onclick="ni()">+ Adicionar item</button></div><p class=m style="font-size:12px">Toque em Editar para mudar nome, preço, estoque e foto.</p>`:''}<div class=gr>${IT.map(i=>`<div class=it ${a?'':`onclick="bq('${i[0]}')"`}><div class=ph ${i[2]?`style="background:url(${i[2]}) center/cover"`:''}></div><b>${i[0]}</b><br><span class=m>Estoque: ${S.stock[i[0]]}</span><br>${i[1]} mil${a?`<br><button class=g onclick="ei('${i[0]}')">Editar</button><button onclick="bq('${i[0]}')">Comprar</button>`:''}</div>`).join('')}</div>${mine()}`};
function ni(){ask('Adicionar item',[{id:'n',l:'Nome do item'},{id:'p',l:'Preço (em mil)',n:1},{id:'e',l:'Estoque inicial',n:1},{id:'f',l:'Foto (opcional)',f:1}],async v=>{if(!NM.test(v.n))return'Nome inválido (letras, números, espaço, ponto e hífen, até 30).';if(S.items.some(i=>i.n.toLowerCase()==v.n.toLowerCase()))return'Já existe um item com esse nome.';let p=+v.p,e=+v.e||0;if(v.p===''||!(p>=0))return'Informe o preço.';if(e<0)return'Estoque inválido.';S.items.push({n:v.n,p,f:await rz(v.fF)});S.stock[v.n]=e;syncIT();log(`${U().nome} adicionou o item ${v.n} (${p} mil, estoque ${e})`,1)})}
function ei(n){let it=S.items.find(i=>i.n==n);if(!it)return;ask(`Editar ${n} (estoque atual: ${S.stock[n]})`,[{id:'n',l:'Nome',d:n},{id:'p',l:'Preço (em mil)',n:1,d:it.p},{id:'e',l:'Somar ao estoque (negativo remove)',n:1},{id:'f',l:'Nova foto (opcional)',f:1},{id:'a',l:'Ação',o:['Salvar alterações','Remover item da loja']}],async v=>{if(v.a[0]=='R'){S.items=S.items.filter(i=>i!=it);delete S.stock[n];syncIT();log(`${U().nome} removeu o item ${n}`,1);return}
let nn=v.n||n,p=v.p===''?it.p:+v.p,d=+v.e||0;if(!NM.test(nn))return'Nome inválido.';if(nn!=n&&S.items.some(i=>i.n.toLowerCase()==nn.toLowerCase()))return'Já existe um item com esse nome.';if(!(p>=0))return'Preço inválido.';if(S.stock[n]+d<0)return'O estoque não pode ficar negativo.';
if(v.fF)it.f=await rz(v.fF);S.stock[n]+=d;if(nn!=n){S.stock[nn]=S.stock[n];delete S.stock[n];S.orders.forEach(o=>{if(o.it==n)o.it=nn});it.n=nn}
it.p=p;syncIT();log(`${U().nome} editou o item ${nn}: preço ${p} mil, estoque ${S.stock[nn]}${d?` (${d>0?'+':''}${d})`:''}`,1)})}
const cps=()=>`<div style="display:flex;justify-content:space-between;align-items:center"><h3 style="margin:0">Cupons de desconto</h3><button onclick="nk()">+ Novo cupom</button></div>${S.cupons.map(c=>`<div class=card><b>${esc(c.c)}</b> — ${c.p}% · usos: ${c.used}${c.max?'/'+c.max:' (sem limite)'}${c.v?' · válido até '+esc(c.v):''}<br><button class=g onclick="rk('${c.c}')">Remover</button></div>`).join('')||'<p class=m>Nenhum cupom criado.</p>'}`;
function nk(){ask('Novo cupom',[{id:'c',l:'Código do cupom'},{id:'p',l:'Desconto (%)',n:1},{id:'m',l:'Limite de usos (0 = sem limite)',n:1},{id:'v',l:'Válido até (AAAA-MM-DD, opcional)'}],v=>{let c=v.c.toUpperCase(),p=+v.p;if(!/^[A-Z0-9_-]{2,20}$/.test(c))return'Código inválido (letras, números, _ e -).';if(S.cupons.some(x=>x.c==c))return'Esse código já existe.';if(!(p>0&&p<=100))return'O desconto deve ficar entre 1 e 100.';if(v.v&&!/^\d{4}-\d{2}-\d{2}$/.test(v.v))return'Use a data no formato AAAA-MM-DD.';S.cupons.push({c,p,max:Math.max(0,+v.m||0),used:0,v:v.v});log(`${U().nome} criou o cupom ${c} (${p}%)`,1)})}
function rk(c){S.cupons=S.cupons.filter(x=>x.c!=c);log(`${U().nome} removeu o cupom ${c}`,1);save();render()}
function ap(k,o,c){let R=m=>say(k,'Sombra','bot',m),cp=S.cupons.find(x=>x.c==c.toUpperCase());if(!cp)return R('Esse cupom de desconto não existe.');if(cp.v&&new Date(cp.v+'T23:59:59')<new Date())return R('Esse cupom expirou.');if(cp.max&&cp.used>=cp.max)return R('Esse cupom atingiu o limite de usos.');o.cup=cp.p;o.cc=cp.c;save();let d=o.cup+o.lv+o.ex;R(`Cupom ${cp.c} aplicado: ${cp.p}% de desconto${cp.max?' (restam '+(cp.max-cp.used)+' usos)':''}. Valor final: ${+(o.q*o.p*(1-d/100)).toFixed(1)} mil.`)}
snap();setInterval(()=>{snap();if(V.scr=='app')render()},36e5);render();
</script></body></html>
